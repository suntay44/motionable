name: macOS tests
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check environment
        run: bash scripts/doctor.sh
      - name: Test scaffolding, engine, narration and examples
        run: bash scripts/test.sh
